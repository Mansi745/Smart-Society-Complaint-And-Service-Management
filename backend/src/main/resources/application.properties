spring.application.name=smart-society-portal

# Database settings come from environment variables (set them on Render).
# If they are not set, it falls back to a local MySQL on your laptop.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_society_portal}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8082}
server.address=0.0.0.0
